services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-iot_anomaly}
      POSTGRES_USER: ${POSTGRES_USER:-iot_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-iot_pass}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-iot_user} -d ${POSTGRES_DB:-iot_anomaly}"]
      interval: 5s
      timeout: 5s
      retries: 10

  pipeline:
    build: .
    depends_on:
      db:
        condition: service_healthy
    env_file: .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-iot_user}:${POSTGRES_PASSWORD:-iot_pass}@db:5432/${POSTGRES_DB:-iot_anomaly}
    command: python main.py
    volumes:
      - ./data:/app/data

  api:
    build: .
    depends_on:
      db:
        condition: service_healthy
      pipeline:
        condition: service_completed_successfully
    env_file: .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-iot_user}:${POSTGRES_PASSWORD:-iot_pass}@db:5432/${POSTGRES_DB:-iot_anomaly}
    ports:
      - "8000:8000"
    command: uvicorn api.routes:app --host 0.0.0.0 --port 8000
    volumes:
      - ./data:/app/data

  dashboard:
    build: .
    depends_on:
      db:
        condition: service_healthy
      pipeline:
        condition: service_completed_successfully
    env_file: .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-iot_user}:${POSTGRES_PASSWORD:-iot_pass}@db:5432/${POSTGRES_DB:-iot_anomaly}
    ports:
      - "8501:8501"
    command: streamlit run app/dashboard.py --server.port 8501 --server.address 0.0.0.0
    volumes:
      - ./data:/app/data

volumes:
  postgres_data:
